<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Playing a local video</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=no" />
    <link rel="stylesheet" href="style.css" />
    <style>
      /* Optional styling for the drop zone */
    </style>
  </head>
  <body>
    <section>
      <video controls id="videoPlayer">
        <source src="" type="video/mp4" />
      </video>

      <!-- Combined input drop zone -->
      <div id="dropZone">
        <p>Click to select files or drag and drop them</p>
      </div>
      <!-- Hidden file input triggered by click on the drop zone -->
      <input type="file" id="mediaInput" multiple accept="video/*,audio/*,.vtt,.srt,.mkv" />

      <br />
      <label for="fontSelect">Font:</label>
      <select id="fontSelect"></select>
      <label for="colorPicker">Color:</label>
      <input type="color" id="colorPicker" value="#FFFFFF" />
      <label for="bgColorPicker">Background Color:</label>
      <input type="color" id="bgColorPicker" value="#000000" />
      <label for="transparencySlider">Background Transparency:</label>
      <input type="range" id="transparencySlider" min="0" max="100" value="100" />
      <label for="fontSizeSlider">Font Size:</label>
      <input type="range" id="fontSizeSlider" min="10" max="80" value="24" />
    </section>

    <script src="fonts.js"></script>

    <script>
      function parse_timestamp(s) {
        var match = s.match(/^(?:(\d{2,}):)?([0-5]\d):([0-5]\d[.,]\d{0,3})/);
        if (match == null) {
          throw "Invalid timestamp format: " + s;
        }
        var hours = parseInt(match[1] || "0", 10);
        var minutes = parseInt(match[2], 10);
        var seconds = parseFloat(match[3].replace(",", "."));
        return seconds + 60 * minutes + 60 * 60 * hours;
      }

      function quick_and_dirty_vtt_or_srt_parser(vtt) {
        var lines = vtt
          .trim()
          .replace("\r\n", "\n")
          .split(/\r?\n/)
          .map(function (line) {
            return line.trim();
          });
        var cues = [];
        var start = null;
        var end = null;
        var payload = null;
        for (var i = 0; i < lines.length; i++) {
          if (lines[i].indexOf("-->") >= 0) {
            var splitted = lines[i].split(/[\t ]+-->[\t ]+/);
            if (splitted.length != 2) {
              throw 'Error when splitting "-->": ' + lines[i];
            }
            start = parse_timestamp(splitted[0]);
            end = parse_timestamp(splitted[1]);
          } else if (lines[i] == "") {
            if (start && end) {
              var cue = new VTTCue(start, end, payload);
              cues.push(cue);
              start = null;
              end = null;
              payload = null;
            }
          } else if (start && end) {
            if (payload == null) {
              payload = lines[i];
            } else {
              payload += "\n" + lines[i];
            }
          }
        }
        return cues;
      }

      function init() {
        const video = document.getElementById("videoPlayer");
        const fontSelect = document.getElementById("fontSelect");
        const colorPicker = document.getElementById("colorPicker");
        const bgColorPicker = document.getElementById("bgColorPicker");
        const transparencySlider = document.getElementById("transparencySlider");
        const fontSizeSlider = document.getElementById("fontSizeSlider");
        const dropZone = document.getElementById("dropZone");
        const mediaInput = document.getElementById("mediaInput");
        const audio = new Audio();
        let currentStyleElement = null;

        // Helper to clear subtitle tracks
        function clearTextTracks() {
          for (let i = 0; i < video.textTracks.length; i++) {
            video.textTracks[i].mode = "disabled";
          }
          const trackElements = video.getElementsByTagName("track");
          while (trackElements.length > 0) {
            video.removeChild(trackElements[0]);
          }
        }

        // Handler for files selected either via the input or drop
        function handleFiles(files) {
          Array.from(files).forEach(function (file) {
            // Process video files
            if (file.type.startsWith("video")) {
              const url = URL.createObjectURL(file);
              video.src = url;
              video.load();
              localStorage.setItem("videoSrc", url);
            }
            // Process audio files
            else if (file.type.startsWith("audio")) {
              const url = URL.createObjectURL(file);
              audio.src = url;
              audio.load();
              localStorage.setItem("audioSrc", url);
              video.muted = true;
              if (!video.paused) {
                audio.currentTime = video.currentTime;
                audio.play();
              }
            }
            // Process subtitle files (check file extension)
            else if (file.name.match(/\.(vtt|srt)$/i)) {
              clearTextTracks();
              const reader = new FileReader();
              reader.onload = function (e) {
                const content = e.target.result;
                const track = video.addTextTrack("subtitles", "Language", "en");
                track.mode = "showing";
                quick_and_dirty_vtt_or_srt_parser(content).forEach(function (cue) {
                  track.addCue(cue);
                });
                updateSubtitleStyle();
              };
              reader.readAsText(file);
            }
          });
        }

        // Trigger file selector when clicking on drop zone
        dropZone.addEventListener("click", function () {
          mediaInput.click();
        });

        // Event listener for file selection via the file input
        mediaInput.addEventListener("change", function (event) {
          if (event.target.files.length > 0) {
            handleFiles(event.target.files);
          }
        });

        // Add drag and drop events to the drop zone
        dropZone.addEventListener("dragover", function (event) {
          event.preventDefault();
          dropZone.classList.add("hover");
        });

        dropZone.addEventListener("dragleave", function (event) {
          event.preventDefault();
          dropZone.classList.remove("hover");
        });

        dropZone.addEventListener("drop", function (event) {
          event.preventDefault();
          dropZone.classList.remove("hover");
          if (event.dataTransfer.files.length > 0) {
            handleFiles(event.dataTransfer.files);
          }
        });

        // Sync audio and video playback
        video.addEventListener("play", function () {
          if (audio.src) {
            audio.currentTime = video.currentTime;
            audio.play();
          }
        });

        video.addEventListener("pause", function () {
          audio.pause();
        });

        video.addEventListener("seeked", function () {
          if (audio.src) {
            audio.currentTime = video.currentTime;
          }
        });

        video.addEventListener("timeupdate", function () {
          if (audio.src && !video.paused) {
            const delta = Math.abs(audio.currentTime - video.currentTime);
            if (delta > 0.3) {
              audio.currentTime = video.currentTime;
            }
          }
        });

        fontSelect.addEventListener("change", updateSubtitleStyle);
        colorPicker.addEventListener("change", updateSubtitleStyle);
        bgColorPicker.addEventListener("change", updateSubtitleStyle);
        transparencySlider.addEventListener("input", updateSubtitleStyle);
        fontSizeSlider.addEventListener("input", updateSubtitleStyle);

        // Apply current subtitle styling by injecting a style element
        function updateSubtitleStyle() {
          const font = fontSelect.value;
          const color = colorPicker.value;
          const bgColor = bgColorPicker.value;
          const transparency = transparencySlider.value / 100;
          const fontSize = fontSizeSlider.value + "px";
          const rgbaBgColor = `rgba(${parseInt(bgColor.slice(1, 3), 16)}, ${parseInt(bgColor.slice(3, 5), 16)}, ${parseInt(
            bgColor.slice(5, 7),
            16
          )}, ${transparency})`;
          if (currentStyleElement) {
            document.head.removeChild(currentStyleElement);
          }
          const style = document.createElement("style");
          style.innerHTML = `::cue { font-family: ${font}; color: ${color}; background-color: ${rgbaBgColor}; font-size: ${fontSize}; }`;
          document.head.appendChild(style);
          currentStyleElement = style;
          localStorage.setItem("font", font);
          localStorage.setItem("color", color);
          localStorage.setItem("bgColor", bgColor);
          localStorage.setItem("transparency", transparencySlider.value);
          localStorage.setItem("fontSize", fontSizeSlider.value);
        }

        // Load saved settings and sources from localStorage
        function loadSettings() {
          const videoSrc = localStorage.getItem("videoSrc");
          if (videoSrc) {
            video.src = videoSrc;
            video.load();
          }
          const audioSrc = localStorage.getItem("audioSrc");
          if (audioSrc) {
            audio.src = audioSrc;
            audio.load();
            video.muted = true;
          }
          const font = localStorage.getItem("font");
          if (font) {
            fontSelect.value = font;
          }
          const color = localStorage.getItem("color");
          if (color) {
            colorPicker.value = color;
          }
          const bgColor = localStorage.getItem("bgColor");
          if (bgColor) {
            bgColorPicker.value = bgColor;
          }
          const transparency = localStorage.getItem("transparency");
          if (transparency) {
            transparencySlider.value = transparency;
          }
          const fontSize = localStorage.getItem("fontSize");
          if (fontSize) {
            fontSizeSlider.value = fontSize;
          }
          updateSubtitleStyle();
        }

        // Populate the font selection using the external function from fonts.js
        populateFontSelect(fontSelect);

        // Keyboard shortcuts for video controls
        document.addEventListener("keydown", function (event) {
          if (event.key === "ArrowLeft") {
            video.currentTime = Math.max(0, video.currentTime - 5);
          } else if (event.key === "ArrowRight") {
            video.currentTime = Math.min(video.duration, video.currentTime + 5);
          } else if (event.key === "ArrowUp") {
            video.volume = Math.min(1, video.volume + 0.1);
          } else if (event.key === "ArrowDown") {
            video.volume = Math.max(0, video.volume - 0.1);
          }
        });

        loadSettings();
      }

      init();
    </script>
  </body>
</html>
